 function formatISODate(d) {
 const y = d.getFullYear();
 const m = String(d.getMonth() + 1).padStart(2, '0');
 const day = String(d.getDate()).padStart(2, '0');
 return `${y}-${m}-${day}`;
 }

 function parseISODate(str) {
 if (!str) return null;
 const [y, m, d] = str.split('-').map(Number);
 return new Date(y, m - 1, d);
 }

 function formatDateLabel(str) {
 if (!str) return "";

 if (!d) return str;
 const day = String(d.getDate()).padStart(2, '0');
 const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
 const mon = months[d.getMonth()];
 const yy = String(d.getFullYear()).slice(-2);
 return `${day}-${mon}-${yy}`;
 }

 function formatValidityPeriod(startDate, endDate) {
 if (!startDate && !endDate) return "";
 const start = parseISODate(startDate);
 const end = parseISODate(endDate);
 const mon = (d) => d.toLocaleDateString(undefined, { month: 'short' });
 if (start && !end) return `From ${mon(start)} ${start.getDate()}, ${start.getFullYear()}`;
 if (!start && end) return `Until ${mon(end)} ${end.getDate()}, ${end.getFullYear()}`;
 if (startDate === endDate) return `${mon(start)} ${start.getDate()}, ${start.getFullYear()}`;
 const sameYear = start.getFullYear() === end.getFullYear();
 const sameMonth = sameYear && start.getMonth() === end.getMonth();
 if (sameMonth) return `${mon(start)} ${start.getDate()}–${end.getDate()}, ${end.getFullYear()}`;
 if (sameYear) return `${mon(start)} ${start.getDate()} – ${mon(end)} ${end.getDate()}, ${end.getFullYear()}`;
 return `${mon(start)} ${start.getDate()}, ${start.getFullYear()} – ${mon(end)} ${end.getDate()}, ${end.getFullYear()}`;
 }

 function formatTimeLabel12(str) {
 if (!str) return "";
 const [hStr, mStr] = str.split(':');
 if (!hStr || !mStr) return str;
 let h = parseInt(hStr, 10);
 const m = mStr.padStart(2, '0');
 const ampm = h >= 12 ? 'PM' : 'AM';
 h = h % 12;
 if (h === 0) h = 12;
 return `${h}:${m} ${ampm}`;
 }

 function sortItemsChronologically(items) {
 return [...items].sort((a, b) => {
 if (!a.date && !b.date) return 0;
 if (!a.date) return 1;
 if (!b.date) return -1;
 const dateDiff = a.date.localeCompare(b.date);
 if (dateDiff !== 0) return dateDiff;
 const timeA = a.time || "";
 const timeB = b.time || "";
 if (!timeA && !timeB) return 0;
 if (!timeA) return 1;
 if (!timeB) return -1;
 return timeA.localeCompare(timeB);
 });
 }

 function isBoilerplateEuropeCoords(lat, lon) {
 return (lat > 48 && lat < 53 && lon > 7 && lon < 12);
 }

 function extractLocationData(locationStr) {
 if (!locationStr) return null;
 const str = locationStr.trim();
 const atMatch = str.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
 if (atMatch) {
 const lat = parseFloat(atMatch[1]);
 const lon = parseFloat(atMatch[2]);
 if (!isBoilerplateEuropeCoords(lat, lon)) return { lat, lon };
 }
 const d3d4 = str.match(/!3d(-?\d+(?:\.\d+)?).*?!4d(-?\d+(?:\.\d+)?)/);
 if (d3d4) {
 const lat = parseFloat(d3d4[1]);
 const lon = parseFloat(d3d4[2]);
 if (!isBoilerplateEuropeCoords(lat, lon)) return { lat, lon };
 }
 const coordMatch = str.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
 if (coordMatch) {
 return { lat: parseFloat(coordMatch[1]), lon: parseFloat(coordMatch[2]) };
 }
 const qCoordMatch = str.match(/(?:q|query|ll|center)=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
 if (qCoordMatch) {
 const lat = parseFloat(qCoordMatch[1]);
 const lon = parseFloat(qCoordMatch[2]);
 if (!isBoilerplateEuropeCoords(lat, lon)) return { lat, lon };
 }
 const qTextMatch = str.match(/(?:q|query)=([^&]+)/);
 if (qTextMatch) {
 return { query: decodeURIComponent(qTextMatch[1].replace(/\+/g, " ")) };
 }
 if (str.includes("/place/")) {
 const placeMatch = str.match(/\/place\/([^\/@?]+)/);
 if (placeMatch) return { query: decodeURIComponent(placeMatch[1].replace(/\+/g, " ")) };
 }
 if (str.includes("goo.gl") || str.includes("maps.app")) {
 return { isShortLink: true, raw: str };
 }
 return { query: str };
 }

 async function resolveItemLocation(item, tripName) {
 const rawLoc = item.location ? item.location.trim() : "";
 if (!rawLoc) return { ...item, geocodeError: true };
 let parsed = extractLocationData(rawLoc);
 if (parsed && parsed.lat && parsed.lon) {
 return { ...item, lat: parsed.lat, lon: parsed.lon };
 }
 if (parsed && (parsed.isShortLink || rawLoc.includes("http"))) {
 const proxyResolvers = [
 async (u) => {
 const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(u)}`);
 const text = await res.text();
 return { finalUrl: res.url || "", textContent: text };
 },
 async (u) => {
 const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(u)}`);
 const data = await res.json();
 return { finalUrl: data.status?.url || "", textContent: data.contents || "" };
 }
 ];
 for (const resolver of proxyResolvers) {
 try {
 const { finalUrl, textContent } = await resolver(rawLoc);
 let fromUrl = extractLocationData(finalUrl);
 if (fromUrl && fromUrl.lat && fromUrl.lon) {
 return { ...item, lat: fromUrl.lat, lon: fromUrl.lon };
 }
 const htmlAt = textContent.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
 if (htmlAt) {
 const lat = parseFloat(htmlAt[1]);
 const lon = parseFloat(htmlAt[2]);
 if (!isBoilerplateEuropeCoords(lat, lon)) return { ...item, lat, lon };
 }
 } catch (e) {}
 }
 }
 const queriesToTry = [];
 let baseQuery = (parsed && parsed.query) ? parsed.query : (!rawLoc.startsWith("http") ? rawLoc : item.name);
 if (baseQuery) queriesToTry.push(baseQuery);
 if (item.name && !queriesToTry.includes(item.name)) queriesToTry.push(item.name);

 let tripContext = "";
 if (tripName) {
 tripContext = tripName.replace(/[0-9]/g, "").replace(/trip|vacation|tour|travel|holiday/gi, "").trim();
 }

 const enhancedQueries = [];
 for (const q of queriesToTry) {
 enhancedQueries.push(q);
 if (tripContext && !q.toLowerCase().includes(tripContext.toLowerCase())) {
 enhancedQueries.unshift(`${q}, ${tripContext}`);
 }
 }

 for (let q of [...new Set(enhancedQueries)]) {
 if (!q) continue;
 try {
 const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`, {
 headers: { 'Accept-Language': 'en' }
 });
 const data = await res.json();
 if (data && data.length > 0) {
 return { ...item, lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
 }
 } catch (e) {}
 }
 return { ...item, geocodeError: true };
 }

 function MapView({ sharedItems, personalItems, categoryColors, onEditItem, tripName }) {
 const mapContainerRef = useRef(null);
 const mapInstanceRef = useRef(null);
 const markersLayerRef = useRef(null);
 const prevItemSignatureRef = useRef("");

 const [geocodedItems, setGeocodedItems] = useState([]);
 const [geocoding, setGeocoding] = useState(false);

 const locatedItems = [
 ...(sharedItems || []).map(i => ({ ...i, source: 'shared' })),
 ...(personalItems || []).map(i => ({ ...i, source: 'personal' }))
 ].filter(i => !!i.location && i.location.trim() !== "");

 useEffect(() => {
 let cancelled = false;
 async function processLocations() {
 if (locatedItems.length === 0) {
 setGeocodedItems([]);
 return;
 }
 setGeocoding(true);
 const results = [];
 for (const item of locatedItems) {
 if (cancelled) break;
 const resolved = await resolveItemLocation(item, tripName);
 results.push(resolved);
 }
 if (!cancelled) {
 setGeocodedItems(results);
 setGeocoding(false);
 }
 }
 processLocations();
 return () => { cancelled = true; };
 }, [JSON.stringify(locatedItems.map(i => ({ id: i.id, loc: i.location, name: i.name }))), tripName]);

 useEffect(() => {
 if (!mapContainerRef.current || typeof L === 'undefined') return;

 if (!mapInstanceRef.current) {
 const map = L.map(mapContainerRef.current).setView([20, 0], 2);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
 maxZoom: 19,
 attribution: '&copy; OpenStreetMap'
 }).addTo(map);

 const markersLayer = L.featureGroup().addTo(map);

 map.on('popupopen', (e) => {
 const popupNode = e.popup.getElement();
 const editBtn = popupNode ? popupNode.querySelector('.popup-edit-btn') : null;
 if (editBtn) {
 editBtn.onclick = () => {
 const itemId = editBtn.getAttribute('data-id');
 const found = locatedItems.find(i => i.id === itemId);
 if (found && onEditItem) onEditItem(found);
 };
 }
 });

 mapInstanceRef.current = map;
 markersLayerRef.current = markersLayer;
 }

 return () => {
 if (mapInstanceRef.current) {
 mapInstanceRef.current.remove();
 mapInstanceRef.current = null;
 markersLayerRef.current = null;
 }
 };
 }, []);

 useEffect(() => {
 const map = mapInstanceRef.current;
 const markersLayer = markersLayerRef.current;
 if (!map || !markersLayer) return;

 markersLayer.clearLayers();
 const validCoords = geocodedItems.filter(i => i.lat && i.lon);

 validCoords.forEach(item => {
 const color = categoryColors[item.category] || "#726C78";
 const customPinIcon = L.divIcon({
 className: 'custom-pin',
 html: `
 <div style="
 background-color: ${color};
 width: 28px;
 height: 28px;
 border-radius: 50% 50% 50% 0;
 transform: rotate(-45deg);

 useEffect(() => {
 function handleFocusIn(e) {
 const tag = e.target.tagName;
 if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") {
 setTimeout(() => {
 e.target.scrollIntoView({ behavior: "smooth", block: "center" });
 }, 300);
 }
 }
 document.addEventListener("focusin", handleFocusIn);
 return () => document.removeEventListener("focusin", handleFocusIn);
 }, []);
 const recentWrites = useRef({ shared: 0, personal: 0 });

 // 1. Establish auth session and listen for changes (login/logout/token refresh)
 useEffect(() => {
 const supabase = getSupabaseClient();
 if (!supabase) {
 setAuthSession(null);
 setLoading(false);
 setCloudStatus("local-only");
 setCloudStatusDetail("Supabase client failed to initialize.");
 return;
 }
 supabase.auth.getSession().then(({ data }) => {
 setAuthSession(data?.session || null);
 });
 const { data: listener } = supabase.auth.onAuthStateChange((event, session) => {
 // TOKEN_REFRESHED fires periodically in the background purely to rotate the
 // access token — the user and their data haven't changed, so skip re-rendering
 // for it entirely rather than flashing the loading screen mid-session.
 if (event === "TOKEN_REFRESHED") return;
 setAuthSession(session || null);
 });

 (async () => {
 try {
 const probeKey = "shared___connectivity_probe__";
 const { error: writeErr } = await supabase
 .from('app_data')
 .upsert({ key: probeKey, value: { ok: true, ts: Date.now() }, updated_at: new Date() });
 if (writeErr) throw writeErr;
 const { error: readErr } = await supabase
 .from('app_data')
 .select('key')
 .eq('key', probeKey)
 .single();
 if (readErr) throw readErr;
 setCloudStatus("connected");
 } catch (e) {
 setCloudStatus("local-only");
 setCloudStatusDetail(e?.message || "Unknown error reaching Supabase.");
 }
 })();

 return () => { listener?.subscription?.unsubscribe(); };
 }, []);

 // 2. Once we know the auth state, load (or create) the profile tied to that account
 const lastLoadedUserId = useRef(null);
 useEffect(() => {
 if (authSession === undefined) return; // still checking
 if (!authSession) { setProfile(null); setLoading(false); lastLoadedUserId.current = null; return; }
 if (lastLoadedUserId.current === authSession.user.id) return; // same user already loaded — don't re-flash the loading screen
 lastLoadedUserId.current = authSession.user.id;
 (async () => {
 setLoading(true);
 const uidKey = authSession.user.id;
 let p = await safeGet(`profile:${uidKey}`, true);
 if (p) {
 if (!p.trips) p.trips = p.lastCode ? [{ code: p.lastCode, name: "Previous Rider", role: "owner" }] : [];
 p.userId = uidKey;
 setProfile(p);
 setProfileNameInput(p.name || "");
 } else {
 const defaultProfile = { userId: uidKey, name: "", trips: [], lastCode: null };
 await safeSet(`profile:${uidKey}`, defaultProfile, true);
 setProfile(defaultProfile);
 setProfileNameInput("");

 if (authPassword.length < 8) { setAuthError("Password must be at least 8 characters."); return; }

 try {
 for (const t of (profile?.trips || [])) {
 const g = await safeGet(`group:${t.code}`, true);

 const stillHasOthers = (g.members || []).some((m) => m.id !== authSession.user.id);
 if (!stillHasOthers) {
 await deleteSharedKey(`group:${t.code}`);

 if (g.viewCode) await deleteSharedKey(`viewcode:${g.viewCode}`);
 } else {
 const updatedGroup = { ...g, members: g.members.filter((m) => m.id !== authSession.user.id) };
 await safeSet(`group:${t.code}`, updatedGroup, true);
 }
 }
 }
 await deleteSharedKey(`profile:${authSession.user.id}`);
 } catch (e) {}

 try {
 await supabase.rpc('delete_own_account');

 setDeleteLoading(false);
 await supabase.auth.signOut();

 const loadTripData = useCallback(async (code, isPoll = false, forceRole = null) => {
 let targetCode = code;
 let isViewOnlyCode = false;

 if (code.startsWith("V-")) {
 targetCode = code.replace("V-", "");
 isViewOnlyCode = true;
 }

 const g = await safeGet(`group:${targetCode}`, true);
 const s = await safeGet(`sharedRider:${targetCode}`, true);
 const per = await safeGet(`personalRider:${targetCode}`, false);
 
if (g) {
 setGroup(g);
 let role = forceRole;
 if (!role) {
 const matchedTrip = profile?.trips?.find(t => t.code === targetCode || t.code === `V-${targetCode}`);
 role = matchedTrip?.role || (isViewOnlyCode ? "received_viewer" : "collaborator");
 }
 setCurrentRole(role);
 }

 const now = Date.now();
 const sharedIsFresh = isPoll && now - recentWrites.current.shared < WRITE_COOLDOWN_MS;
 const personalIsFresh = isPoll && now - recentWrites.current.personal < WRITE_COOLDOWN_MS;

 if (!sharedIsFresh) {
 if (s) setShared(s);
 else if (!isPoll) setShared({ items: [], proposals: [], activity: [], accommodations: {} });
 }
 if (!personalIsFresh) {
 if (per) setPersonal(per);
 else if (!isPoll) setPersonal({ items: [] });
 }
 return g;
 }, [profile]);

 useEffect(() => {
 if (screen === "trip" && group) {
 pollRef.current = setInterval(() => {

 }, 3000);
 return () => clearInterval(pollRef.current);

 }, [screen, group?.code, loadTripData]);

 ok = await safeSet(key, value, shared);

 }

setGroup(newGroup);

 async function handleJoinTrip() {
 setError("");
 const rawCode = joinCodeInput.trim().toUpperCase();
 if (!rawCode) { setError("Enter a rider passcode."); return; }

 let targetCode = rawCode;
 let isViewer = false;

 // try it as a main collaborative code first
 let g = await safeGet(`group:${targetCode}`, true);

 if (!g) {
 // try it as an independent view-only code via the reverse-lookup record
 const mapping = await safeGet(`viewcode:${rawCode}`, true);
 if (mapping?.code) {
 g = await safeGet(`group:${mapping.code}`, true);
 isViewer = true;
 }
 }

 if (!g && rawCode.startsWith("V-")) {
 // legacy fallback for trips created before view codes were made independent
 targetCode = rawCode.replace("V-", "");
 g = await safeGet(`group:${targetCode}`, true);
 isViewer = true;
 }

 if (!g) { setError("No rider found with that passcode."); return; }

 if (g.viewCode === rawCode) {
 isViewer = true;
 }

 const role = isViewer ? "received_viewer" : "collaborator";
 const p = await ensureProfile({ code: g.code, viewCode: g.viewCode, name: g.name, startDate: g.startDate, endDate: g.endDate, joinedAt: Date.now(), role });
 
if (!g.members.some((m) => m.id === p.userId)) {
 g.members.push({ id: p.userId, name: p.name, joinedAt: Date.now(), role });
 await persist(`group:${g.code}`, g, true);
 }
 
await loadTripData(g.code, false, role);
 setScreen("trip");
 }

 const updatedTrips = trips.map(t => t.code === code ? { ...t, name: g.name, startDate: g.startDate, endDate: g.endDate, role } : t);
 await saveProfile({ ...profile, trips: updatedTrips, lastCode: code });

 async function syncNameAcrossTrips(newName, userId, trips) {
 for (const t of trips || []) {
 try {
 const g = await safeGet(`group:${t.code}`, true);
 if (g && Array.isArray(g.members)) {
 const idx = g.members.findIndex((m) => m.id === userId);
 if (idx !== -1 && g.members[idx].name !== newName) {

 const nextItems = shared.items.map((it) => {
 if (it.id !== itemId) return it;
 let optIns = it.optIns || [];
 let optOuts = it.optOuts || [];

 if (choice === 'in') {
 if (optIns.includes(profile.userId)) {
 optIns = optIns.filter((id) => id !== profile.userId);
 } else {
 optIns = [...optIns.filter((id) => id !== profile.userId), profile.userId];
 optOuts = optOuts.filter((id) => id !== profile.userId);
 }
 } else if (choice === 'out') {
 if (optOuts.includes(profile.userId)) {
 optOuts = optOuts.filter((id) => id !== profile.userId);
 } else {
 optOuts = [...optOuts.filter((id) => id !== profile.userId), profile.userId];
 optIns = optIns.filter((id) => id !== profile.userId);
 }
 }
 return { ...it, optIns, optOuts };
 });

 const next = { ...shared, items: nextItems };
 setShared(next);
 recentWrites.current.shared = Date.now();

 </div>

 <button onClick={() => setShowShareModal(false)} className="w-full font-mono text-[9px] font-bold text-[#726C78] hover:text-[#17151D] py-1">
 Close
 </button>
 </div>
 </div>
 </div>
 )}

 {(showAddShared || showAddPersonal || editSharedItem || editPersonalItem) && !isReceivedViewer && (
 <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-start justify-center z-50 p-2 pt-10 pb-10 overflow-y-auto" onClick={resetForm}>
 <div className="cartoon-card p-3.5 w-full max-w-xs bg-[#FAF7F2] my-auto" onClick={(e) => e.stopPropagation()}>
 <div className="flex items-center justify-between mb-2.5 pb-1.5 border-b border-[#17151D]/18">
 <div className="font-display text-base text-[#17151D]">
 {showAddShared && "Propose Item"}
 {showAddPersonal && "Add Private Item"}
 {(editSharedItem || editPersonalItem) && "Edit Item"}
 </div>
 </div>
 
<div className="space-y-2.5 text-[11px]">
 <div>
 <label className="font-mono text-[9px] font-extrabold text-[#17151D] uppercase block mb-0.5">
 What do you need <span className="text-[#FF3D6E] font-bold">*</span>
 </label>
 <input
 autoFocus
 className={`cartoon-input w-full text-xs ${nameError ? 'border-red-500 bg-red-500/10' : ''}`}
 placeholder="e.g. Catamaran tour"
 value={formName}
 onChange={(e) => {
 setFormName(e.target.value);
 if (e.target.value.trim()) setNameError(false);
 }}
 />
 {nameError && <div className="text-[8px] font-mono text-red-500 font-bold mt-0.5">⚠️ Required</div>}
 </div>

 <div className="grid grid-cols-2 gap-2">
 <div>
 <label className="font-mono text-[9px] font-extrabold text-[#17151D] uppercase block mb-0.5">Category <span className="text-[#FF3D6E] font-bold">*</span></label>
 <select
 className="cartoon-input w-full font-bold text-[11px] transition-colors cursor-pointer"
 style={{ borderColor: CATEGORY_COLORS[formCategory] || "#17151D", color: CATEGORY_COLORS[formCategory] || "#17151D" }}
 value={formCategory}
 onChange={(e) => setFormCategory(e.target.value)}
 >
 {CATEGORIES.map((c) => <option key={c} value={c} style={{ color: '#17151D', backgroundColor: '#FAF7F2' }}>{c}</option>)}
 </select>
 </div>

 <div>
 <label className="font-mono text-[9px] font-extrabold text-[#17151D] uppercase block mb-0.5">Priority <span className="text-[#FF3D6E] font-bold">*</span></label>
 <select
 className="cartoon-input w-full font-bold text-[11px] transition-colors cursor-pointer"
 style={{ backgroundColor: PRIORITY_STYLES[formPriority]?.hex || "#2FBF82", color: '#FFFFFF', borderColor: '#17151D' }}
 value={formPriority}
 onChange={(e) => setFormPriority(e.target.value)}
 >
 {PRIORITIES.map((p) => {
 const pStyle = PRIORITY_STYLES[p];
 return (
 <option key={p} value={p} style={{ backgroundColor: '#FAF7F2', color: '#17151D' }}>
 {p} ({pStyle.letter})
 </option>
 );
 })}
 </select>
 </div>
 </div>

 <div className="grid grid-cols-2 gap-2">
 <div>
 <label className="font-mono text-[9px] font-bold text-[#726C78] uppercase block mb-0.5">Date</label>
 <input
 type="date"
 className="cartoon-input w-full font-mono text-[10px]"
 value={formDate}
 onChange={(e) => setFormDate(e.target.value)}
 min={group?.startDate || undefined}
 max={group?.endDate || undefined}
 />
 </div>
 <div>
 <label className="font-mono text-[9px] font-bold text-[#726C78] uppercase block mb-0.5 flex items-center justify-between">
 <span>Time</span>
 {formTime && (
 <span className={`font-mono text-[9px] font-extrabold px-1.5 py-0.2 rounded ${formTime < "12:00" ? "bg-[#F2732D]/15 text-[#F2732D]" : "bg-[#3D5FFF]/15 text-[#3D5FFF]"}`}>
 {formatTimeLabel12(formTime)}
 </span>
 )}
 </label>
 <input type="time" className="cartoon-input w-full font-mono text-[10px]" value={formTime} onChange={(e) => setFormTime(e.target.value)} />
 </div>
 </div>

 <div>
 <label className="font-mono text-[9px] font-bold text-[#726C78] uppercase block mb-0.5">Address / Location</label>
 <input className="cartoon-input w-full text-[11px]" placeholder="e.g. Eagle Beach or lat,lon" value={formLocation} onChange={(e) => setFormLocation(e.target.value)} />
 </div>

 <div>
 <label className="font-mono text-[9px] font-bold text-[#726C78] uppercase block mb-0.5">Notes</label>
 <textarea className="cartoon-input w-full text-[11px] resize-none" rows={1} placeholder="Optional notes..." value={formNotes} onChange={(e) => setFormNotes(e.target.value)} />
 </div>

 <div className="flex gap-2 pt-1">
 <button onClick={resetForm} className="cartoon-btn flex-1 bg-white py-1.5 font-display text-[11px] uppercase">Cancel</button>
 <button
 onClick={
 showAddShared ? submitProposeAdd :
 editSharedItem ? submitDirectEditShared :
 editPersonalItem ? submitEditPersonal :
 submitAddPersonal
 }
 className="cartoon-btn flex-1 bg-[#FF3D6E] text-white py-1.5 font-display text-[11px] uppercase"
 >
 {showAddShared && "Propose"}
 {editSharedItem && "Save"}
 {showAddPersonal && "Add"}
 {editPersonalItem && "Save"}
 </button>
 </div>
 </div>
 </div>
 </div>
 )}
 </div>
 );
 }

 function Root() {
 return (
 <React.Fragment>
 <style>{FONT_STYLES}</style>
 <App />
 </React.Fragment>
 );
 }

 const root = ReactDOM.createRoot(document.getElementById("root"));
 root.render(<Root />);
 </script>
</body>
</html>
